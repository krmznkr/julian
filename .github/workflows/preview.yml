name: Preview

# Uploads each PR as a Worker version with a preview alias (no traffic) and
# comments its URL. Fork PRs and repos without the Cloudflare token skip it.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 93527c9983d1c08638cb9c1de99f0450
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not available; skipping the preview."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.token.outputs.present == 'true'
        id: build
        uses: ./.github/actions/build-web
        with:
          channel: preview
          pr-number: ${{ env.PR_NUMBER }}
      - if: steps.token.outputs.present == 'true'
        id: upload
        name: Upload a preview version
        working-directory: apps/edge
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias "pr-$PR_NUMBER" \
            --message "Preview of #$PR_NUMBER" \
            --var "APP_VERSION:${{ steps.build.outputs.version }}" \
            --var "APP_CHANNEL:preview" \
            --var "APP_COMMIT:${{ steps.build.outputs.commit }}" | tee upload.log
          url=$(grep -oE 'Version Preview Alias URL: https://[^ ]+' upload.log | awk '{print $5}')
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        name: Comment the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.upload.outputs.url }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          marker="<!-- julian-preview -->"
          body="$marker
          **Preview:** $URL
          Version \`$VERSION\`. Google sign-in is disabled on previews (origin not allowed); the demo works."
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
