name: Build web
description: >
  Install, build the web app (with the marketing pages copied into its dist)
  for one release channel, refuse a bundle that
  contains the Google client secret, and expose the build metadata.

inputs:
  channel:
    description: stable | nightly | preview
    required: true
  pr-number:
    description: Pull request number (preview channel only)
    required: false
    default: ""

outputs:
  version:
    description: App version string for this build
    value: ${{ steps.info.outputs.version }}
  channel:
    value: ${{ steps.info.outputs.channel }}
  commit:
    value: ${{ steps.info.outputs.commit }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.15.0
    - shell: bash
      run: bun install --frozen-lockfile
    - id: info
      shell: bash
      env:
        APP_CHANNEL: ${{ inputs.channel }}
        APP_PR_NUMBER: ${{ inputs.pr-number }}
      run: bun packages/release/src/cli.ts | tee -a "$GITHUB_OUTPUT"
    # The client ID is a public OAuth identifier; the confidential secret lives
    # only in the Worker secret store.
    - shell: bash
      env:
        APP_CHANNEL: ${{ inputs.channel }}
        APP_PR_NUMBER: ${{ inputs.pr-number }}
        VITE_GOOGLE_CLIENT_ID: 151900009012-fevbjvlejmju4lva9brr5lmufp5q4g0s.apps.googleusercontent.com
      run: bun run build
    # The Google client secret must never appear in the static bundle. apps/web/dist
    # is the Worker's whole assets directory, marketing pages included.
    - name: Verify no client secret in dist
      shell: bash
      run: |
        if grep -rqE 'GOCSPX-[A-Za-z0-9_-]+' apps/web/dist/; then
          echo "ERROR: a client secret was found in apps/web/dist/ — aborting deploy." >&2
          exit 1
        fi
