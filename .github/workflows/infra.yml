name: Infra

# Plans the Alchemy stack (infra/) on PRs that touch it or the edge Worker, and
# applies it only when run by hand. Releases apply it from deploy-stable.yml.
# Plans use the least-privilege CLOUDFLARE_PREVIEW_TOKEN; only the apply job,
# in the production environment, sees CLOUDFLARE_API_TOKEN.
# Nothing here ever destroys resources.
on:
  pull_request:
    paths:
      - "infra/**"
      - "apps/edge/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan (otherwise only plan)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    # Fork PRs get no secrets; the repo variable stays unset until the state
    # store has been bootstrapped (docs/infrastructure.md).
    if: >-
      vars.ALCHEMY_ENABLED == 'true'
      && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 93527c9983d1c08638cb9c1de99f0450
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check for the Cloudflare token
        id: token
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_PREVIEW_TOKEN is not available; skipping the plan."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - if: steps.token.outputs.present == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        name: Plan
        run: pnpm exec alchemy plan --stage prod --detailed --no-input

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Shared by every workflow that applies the production Alchemy state.
    concurrency:
      group: alchemy-prod
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 93527c9983d1c08638cb9c1de99f0450
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check for the Cloudflare token
        id: token
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not available; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - if: steps.token.outputs.present == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        name: Apply
        run: pnpm exec alchemy deploy --stage prod --yes --no-input
