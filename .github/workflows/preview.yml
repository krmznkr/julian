name: Preview

# Uploads each PR as a Worker version with a preview alias (no traffic) and
# comments its URL. It uses the least-privilege CLOUDFLARE_PREVIEW_TOKEN; fork
# PRs and repos without that secret skip it.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 93527c9983d1c08638cb9c1de99f0450
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_PREVIEW_TOKEN is not available; skipping the preview."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.token.outputs.present == 'true'
        id: build
        uses: ./.github/actions/build-web
        with:
          channel: preview
          pr-number: ${{ env.PR_NUMBER }}
      # `preview_urls: true` in wrangler.jsonc only takes effect on `wrangler
      # deploy`, and the stable Worker ships with `versions upload` + `versions
      # deploy`, so the setting never reached Cloudflare and uploads came back
      # without a URL. Turn Version URLs on here, keeping the workers.dev route
      # as it is. Idempotent; a no-op once the setting is on.
      - if: steps.token.outputs.present == 'true'
        id: version-urls
        name: Make sure Version URLs are on
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          current=$(curl -fsS "${auth[@]}" "$api/workers/scripts/julian/subdomain" || true)
          enabled=$(jq -r '.result.enabled // false' <<<"$current")
          previews=$(jq -r '.result.previews_enabled // false' <<<"$current")
          if [ "$previews" != "true" ]; then
            if curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/json" \
              --data "{\"enabled\": $enabled, \"previews_enabled\": true}" \
              "$api/workers/scripts/julian/subdomain" > /dev/null; then
              echo "Enabled Version URLs for the julian Worker."
            else
              echo "::warning::Could not enable Version URLs; the token may lack Workers Scripts Edit."
            fi
          fi
          subdomain=$(curl -fsS "${auth[@]}" "$api/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
          echo "subdomain=$subdomain" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        id: upload
        name: Upload a preview version
        working-directory: apps/edge
        env:
          VERSION: ${{ steps.build.outputs.version }}
          COMMIT: ${{ steps.build.outputs.commit }}
          SUBDOMAIN: ${{ steps.version-urls.outputs.subdomain }}
        run: |
          bun run wrangler versions upload \
            --preview-alias "pr-$PR_NUMBER" \
            --message "Preview of #$PR_NUMBER" \
            --var "APP_VERSION:$VERSION" \
            --var "APP_CHANNEL:preview" \
            --var "APP_COMMIT:$COMMIT" | tee upload.log
          url=$(grep -oE 'Version Preview Alias URL: https://[^ ]+' upload.log | awk '{print $5}' || true)
          version_id=$(grep -oE 'Worker Version ID: [0-9a-f-]+' upload.log | awk '{print $4}')
          test -n "$version_id"
          # Some wrangler versions print no alias URL even when it works; the
          # alias URL's shape is fixed, so build it from the account subdomain.
          if [ -z "$url" ] && [ -n "$SUBDOMAIN" ]; then
            candidate="https://pr-$PR_NUMBER-julian.$SUBDOMAIN.workers.dev"
            if curl -fsS -o /dev/null --retry 5 --retry-delay 3 --retry-all-errors "$candidate/demo"; then
              url="$candidate"
            fi
          fi
          # wrangler prints the URL only when Preview URLs are enabled for the
          # Worker. Deploys do not change that setting.
          if [ -z "$url" ]; then
            echo "::warning::Cloudflare returned no preview URL for version $version_id. Preview URLs may be disabled for the Worker (Cloudflare dashboard: Worker > Settings > Domains & Routes > Preview URLs)."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        name: Comment the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.upload.outputs.url }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          marker="<!-- julian-preview -->"
          if [ -n "$URL" ]; then
            preview="**Preview:** $URL · **Demo:** $URL/demo"
            note=" Google sign-in goes through the production callback (see docs/security.md), so it works once production has that relay; the demo always works."
          else
            preview="**Preview:** Cloudflare returned no preview URL for version \`$VERSION_ID\`. Preview URLs may be disabled for the Worker (Cloudflare dashboard: Worker > Settings > Domains & Routes > Preview URLs)."
            note=""
          fi
          body="$marker
          $preview
          Version \`$VERSION\`.$note"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
