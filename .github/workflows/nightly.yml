name: Nightly

# Deploys main to julian-nightly.krmznkr.com (wrangler env "nightly") once a
# day, but only when main moved since the last nightly tag.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: diff
        run: |
          last=$(git tag --list 'nightly-*' --sort=-creatordate | head -n 1)
          if [ -n "$last" ] && [ "$(git rev-parse "$last^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "main has not changed since $last; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    environment:
      name: nightly
      url: https://julian-nightly.krmznkr.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 93527c9983d1c08638cb9c1de99f0450
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: build
        uses: ./.github/actions/build-web
        env:
          JULIAN_SOURCEMAPS: "true"
        with:
          channel: nightly
      - name: Upload private Sentry source maps and remove public maps
        working-directory: apps/web
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.build.outputs.commit }}
        run: |
          # Fail closed: a missing token or upload failure stops deployment.
          # Cleanup also runs on failure; no map may reach Workers assets.
          trap 'find dist -type f -name "*.map" -delete' EXIT
          test -n "$SENTRY_AUTH_TOKEN"
          test -n "$(find dist -type f -name '*.map' -print -quit)"
          pnpm sentry:sourcemaps
          find dist -type f -name '*.map' -delete
          test -z "$(find dist -type f -name '*.map' -print -quit)"
      # Production infrastructure (infra/, Alchemy) is applied only from
      # deploy-stable.yml or a manual run of infra.yml, never from untagged main.
      - name: Set the nightly Google client secret
        working-directory: apps/edge
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning::GOOGLE_CLIENT_SECRET is not set; nightly sign-in will report server_misconfigured."
            exit 0
          fi
          printf '%s' "$GOOGLE_CLIENT_SECRET" | pnpm exec wrangler secret put GOOGLE_CLIENT_SECRET --env nightly
      - name: Deploy the nightly Worker
        working-directory: apps/edge
        env:
          VERSION: ${{ steps.build.outputs.version }}
          COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          pnpm exec wrangler deploy --env nightly \
            --var "APP_VERSION:$VERSION" \
            --var "APP_CHANNEL:nightly" \
            --var "APP_COMMIT:$COMMIT"
      - name: Tag and publish the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          tag="nightly-$(date -u +%Y%m%d)"
          # A second run on the same day replaces that day's nightly.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          # Notes cover everything since the last stable release, when there is one.
          since=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          gh release create "$tag" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title "Nightly $VERSION" \
            --generate-notes \
            ${since:+--notes-start-tag "$since"}
