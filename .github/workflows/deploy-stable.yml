name: Deploy stable

# Production ships only from a release tag. Gradual rollout: upload the new
# version, route 10% to it, smoke-test it, then promote to 100%. A failed smoke
# test puts 100% back on the previous version.
on:
  workflow_call:
    inputs:
      ref:
        description: Release tag to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy (e.g. v0.2.0)
        type: string
        required: true

permissions:
  contents: read

# Shared by every workflow that applies the production Alchemy state.
concurrency:
  group: alchemy-prod
  cancel-in-progress: false

env:
  REF: ${{ inputs.ref }}
  PRODUCTION_URL: https://julian.krmznkr.com
  # The Worker's bot filter rejects curl's default user agent.
  SMOKE_UA: "Mozilla/5.0 (compatible; julian-release-smoke)"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a release tag
        run: |
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ref must be a release tag like v1.2.3, got '$REF'"
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://julian.krmznkr.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 93527c9983d1c08638cb9c1de99f0450
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
      - id: build
        uses: ./.github/actions/build-web
        env:
          JULIAN_SOURCEMAPS: "true"
        with:
          channel: stable
      - name: Upload private Sentry source maps and remove public maps
        working-directory: apps/web
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.build.outputs.commit }}
        run: |
          # Fail closed: a missing token or upload failure stops deployment.
          # Cleanup also runs on failure; no map may reach Workers assets.
          trap 'find dist -type f -name "*.map" -delete' EXIT
          test -n "$SENTRY_AUTH_TOKEN"
          test -n "$(find dist -type f -name '*.map' -print -quit)"
          bun run sentry:sourcemaps
          find dist -type f -name '*.map' -delete
          test -z "$(find dist -type f -name '*.map' -print -quit)"
      # Zone settings from infra/ (Alchemy). Off until the state store is
      # bootstrapped; see docs/infrastructure.md.
      - name: Apply the Alchemy stack
        if: vars.ALCHEMY_ENABLED == 'true'
        working-directory: infra
        run: bun run alchemy deploy --stage prod --yes --no-input
      # The version with the largest traffic share; none on a first deploy.
      - name: Find the version currently serving production
        id: current
        run: |
          status=$(bun run wrangler deployments status --json 2>/dev/null || true)
          id=$(jq -r '(.versions // []) | max_by(.percentage) | .version_id // empty' <<<"${status:-null}" 2>/dev/null || true)
          if [ -z "$id" ]; then
            echo "::notice::No previous version found; the release will go straight to 100% with no rollback target."
          fi
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
      - name: Upload the new version
        id: upload
        env:
          VERSION: ${{ steps.build.outputs.version }}
          COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          bun run wrangler versions upload \
            --tag "$REF" \
            --message "Release $REF" \
            --var "APP_VERSION:$VERSION" \
            --var "APP_CHANNEL:stable" \
            --var "APP_COMMIT:$COMMIT" | tee upload.log
          id=$(grep -oE 'Worker Version ID: [0-9a-f-]+' upload.log | awk '{print $4}')
          test -n "$id"
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
      - name: Route 10% of traffic to the new version
        if: steps.current.outputs.version_id != ''
        env:
          NEW_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          OLD_VERSION_ID: ${{ steps.current.outputs.version_id }}
        run: |
          bun run wrangler versions deploy -y \
            --message "Canary $REF" \
            "$NEW_VERSION_ID@10%" \
            "$OLD_VERSION_ID@90%"
      - name: Deploy the first release straight to 100%
        if: steps.current.outputs.version_id == ''
        env:
          NEW_VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          bun run wrangler versions deploy -y \
            --message "Release $REF" \
            "$NEW_VERSION_ID@100%"
      - name: Smoke test the new version
        env:
          NEW_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          EXPECTED: ${{ steps.build.outputs.version }}
        run: |
          # Pin the requests to the new version rather than relying on the 10% split.
          override="Cloudflare-Workers-Version-Overrides: julian=\"$NEW_VERSION_ID\""
          for attempt in 1 2 3 4 5; do
            served=$(curl -fsS -A "$SMOKE_UA" -H "$override" "$PRODUCTION_URL/version.json" | jq -r .version) || served=""
            if [ "$served" = "$EXPECTED" ] \
              && curl -fsS -A "$SMOKE_UA" -H "$override" "$PRODUCTION_URL/" | grep -q 'class="site-header"' \
              && curl -fsS -A "$SMOKE_UA" -H "$override" "$PRODUCTION_URL/demo" | grep -q '<div id="root"'; then
              echo "Smoke test passed on attempt $attempt"
              exit 0
            fi
            sleep 15
          done
          echo "Smoke test failed: expected $EXPECTED, got '$served'" >&2
          exit 1
      - name: Promote to 100%
        if: steps.current.outputs.version_id != ''
        env:
          NEW_VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          bun run wrangler versions deploy -y \
            --message "Release $REF" \
            "$NEW_VERSION_ID@100%"
      - name: Roll back on failure
        if: failure() && steps.current.outputs.version_id != ''
        env:
          OLD_VERSION_ID: ${{ steps.current.outputs.version_id }}
        run: |
          bun run wrangler versions deploy -y \
            --message "Automatic rollback of $REF" \
            "$OLD_VERSION_ID@100%"
