name: Keep auto-merge PRs current

# The `main` ruleset requires branches to be up to date before merging
# (`strict_required_status_checks_policy`). Every merge therefore leaves all
# other open PRs BEHIND, and GitHub's auto-merge will not update them itself —
# so a queue of green, auto-merge-enabled Dependabot PRs would sit indefinitely
# waiting for something to move them. This is that something.

on:
  push:
    branches: [main]
  # An auto-merge lands with GITHUB_TOKEN, and pushes made with that token
  # start no workflows, so the push trigger never sees it. The schedule moves
  # the rest of the queue along.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update every open PR that is already set to auto-merge
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only touch PRs that have auto-merge enabled: those have already been
          # opted in, so updating them cannot merge anything a human did not ask
          # for. A DIRTY branch has a real conflict and needs a person.
          #
          # GitHub recomputes mergeStateStatus lazily and reports UNKNOWN right
          # after main moves, which is exactly when the push trigger runs, so
          # wait for it to settle before deciding nothing is behind.
          for attempt in 1 2 3 4 5 6; do
            states=$(gh pr list --repo "$REPO" --state open \
              --json number,headRefName,autoMergeRequest,mergeStateStatus \
              --jq '[.[] | select(.autoMergeRequest != null)]')
            if [ "$(jq 'any(.[]; .mergeStateStatus == "UNKNOWN")' <<<"$states")" = false ]; then
              break
            fi
            echo "Merge state not computed yet (attempt $attempt); waiting."
            sleep 10
          done

          prs=$(jq -r '.[] | select(.mergeStateStatus == "BEHIND") | "\(.number) \(.headRefName)"' <<<"$states")

          if [ -z "$prs" ]; then
            echo "No auto-merge PRs are behind main."
            exit 0
          fi

          updated=false
          while read -r pr branch; do
            echo "Updating PR #$pr"
            # A failure here is not fatal: the next run retries, and a branch
            # that cannot be updated needs a human anyway.
            if gh pr update-branch "$pr" --repo "$REPO"; then
              updated=true
            else
              echo "Could not update #$pr; leaving it for review."
            fi
          done <<<"$prs"
          echo "updated=$updated" >>"$GITHUB_OUTPUT"

      # The branch update is pushed with GITHUB_TOKEN, and GitHub holds the PR's
      # own CI run for approval (`action_required`) instead of starting it, so
      # the required `ci` check would stay pending and block auto-merge. A
      # dispatched run does not satisfy the PR's merge requirements, so approve
      # the held run itself.
      - name: Approve held CI runs on auto-merge PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          UPDATED: ${{ steps.update.outputs.updated }}
        run: |
          set -euo pipefail

          # The run appears a moment after the branch moves; wait for it only
          # when this job moved a branch.
          attempts=1
          if [ "$UPDATED" = true ]; then attempts=6; fi

          for attempt in $(seq 1 "$attempts"); do
            while read -r branch sha; do
              [ -n "$branch" ] || continue
              for run in $(gh run list --repo "$REPO" --branch "$branch" \
                --event pull_request --limit 10 \
                --json databaseId,headSha,conclusion \
                --jq ".[] | select(.headSha == \"$sha\" and .conclusion == \"action_required\") | .databaseId"); do
                echo "Approving run $run on $branch"
                gh api -X POST "repos/$REPO/actions/runs/$run/approve" >/dev/null \
                  || echo "Could not approve run $run; leaving it for review."
              done
            done < <(gh pr list --repo "$REPO" --state open \
              --json headRefName,headRefOid,autoMergeRequest \
              --jq '.[] | select(.autoMergeRequest != null) | "\(.headRefName) \(.headRefOid)"')

            # Several PRs were moved at once and their runs appear one by one,
            # so keep looking for the full window rather than stopping at the
            # first approval; an approved run is no longer `action_required`.
            if [ "$attempt" -lt "$attempts" ]; then sleep 10; fi
          done
