# Git hooks, run by prek (https://prek.j178.dev). `bun install` installs them.
repos:
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: node_modules/.bin/oxfmt
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: oxlint
        name: oxlint
        entry: node_modules/.bin/oxlint --deny-warnings
        language: system
        types_or: [javascript, jsx, ts, tsx]
