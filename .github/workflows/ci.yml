name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Merges made with GITHUB_TOKEN (Dependabot auto-merge) do not trigger push
  # runs, so main can be left unchecked. Run by hand to validate it; see
  # docs/releasing.md.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint, format, dead-code and the functional rules previously ran only in
      # the pre-commit hook, one --no-verify away from never running at all.
      - run: pnpm quality:static
      - run: pnpm test:coverage
      - run: pnpm test:tz:dates
      - run: pnpm build
      # workerd rejects entry modules that wrangler's bundler accepts, so boot
      # the real runtime once against the build.
      - name: Smoke test the edge Worker under wrangler dev
        run: scripts/smoke-edge.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ubuntu-latest serves more than one Ubuntu release at a time, and the
      # apt packages below are release-specific.
      - name: Resolve the Playwright cache key
        id: playwright
        run: |
          version=$(pnpm --filter @julian/e2e exec playwright --version | awk '{print $2}')
          . /etc/os-release
          echo "key=playwright-$RUNNER_OS-$RUNNER_ARCH-ubuntu$VERSION_ID-$version" >> "$GITHUB_OUTPUT"
      # A cold install is slow because of apt, not the browser: the runner's
      # Ubuntu mirror has served Playwright's ~25 MB of font packages at
      # 30-70 kB/s (6-14 minutes). Cache those .debs with the browser.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: ${{ steps.playwright.outputs.key }}
      - name: Seed apt with the cached packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: find ~/.cache/playwright-debs -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +
      # The tests run headless, which uses the headless shell, not full Chrome.
      # A cached browser is not downloaded again, and apt only fetches packages
      # whose cached .deb no longer matches the archive's version.
      - run: pnpm --filter @julian/e2e exec playwright install --with-deps --only-shell chromium
      - name: Keep the downloaded apt packages for the cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/playwright-debs
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-debs {} +
          ls -l ~/.cache/playwright-debs
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:lighthouse
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: apps/e2e/.lighthouseci/reports
          retention-days: 14
