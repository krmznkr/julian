name: Deploy stable

# Production ships only from a release tag. Gradual rollout: upload the new
# version, route 10% to it, smoke-test it, then promote to 100%. A failed smoke
# test puts 100% back on the previous version.
on:
  workflow_call:
    inputs:
      ref:
        description: Release tag to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy (e.g. v0.2.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-stable
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 93527c9983d1c08638cb9c1de99f0450
  PRODUCTION_URL: https://julian.krmznkr.com
  # The Worker's bot filter rejects curl's default user agent.
  SMOKE_UA: "Mozilla/5.0 (compatible; julian-release-smoke)"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://julian.krmznkr.com
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: build
        uses: ./.github/actions/build-web
        with:
          channel: stable
      # Zone settings from infra/ (Alchemy). Off until the state store is
      # bootstrapped; see docs/infrastructure.md.
      - name: Apply the Alchemy stack
        if: vars.ALCHEMY_ENABLED == 'true'
        working-directory: infra
        run: pnpm exec alchemy deploy --stage prod --yes --no-input
      - name: Find the version currently serving production
        id: current
        run: |
          id=$(pnpm exec wrangler deployments status --json | jq -r '.versions[0].version_id')
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
      - name: Upload the new version
        id: upload
        run: |
          pnpm exec wrangler versions upload \
            --tag "${{ inputs.ref }}" \
            --message "Release ${{ inputs.ref }}" \
            --var "APP_VERSION:${{ steps.build.outputs.version }}" \
            --var "APP_CHANNEL:stable" \
            --var "APP_COMMIT:${{ steps.build.outputs.commit }}" | tee upload.log
          id=$(grep -oE 'Worker Version ID: [0-9a-f-]+' upload.log | awk '{print $4}')
          test -n "$id"
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
      - name: Route 10% of traffic to the new version
        run: |
          pnpm exec wrangler versions deploy -y \
            --message "Canary ${{ inputs.ref }}" \
            "${{ steps.upload.outputs.version_id }}@10%" \
            "${{ steps.current.outputs.version_id }}@90%"
      - name: Smoke test the new version
        env:
          NEW_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          EXPECTED: ${{ steps.build.outputs.version }}
        run: |
          # Pin the requests to the new version rather than relying on the 10% split.
          override="Cloudflare-Workers-Version-Overrides: julian=\"$NEW_VERSION_ID\""
          for attempt in 1 2 3 4 5; do
            served=$(curl -fsS -A "$SMOKE_UA" -H "$override" "$PRODUCTION_URL/version.json" | jq -r .version) || served=""
            if [ "$served" = "$EXPECTED" ] \
              && curl -fsS -A "$SMOKE_UA" -H "$override" "$PRODUCTION_URL/" | grep -q 'class="site-header"' \
              && curl -fsS -A "$SMOKE_UA" -H "$override" "$PRODUCTION_URL/demo" | grep -q '<div id="root"'; then
              echo "Smoke test passed on attempt $attempt"
              exit 0
            fi
            sleep 15
          done
          echo "Smoke test failed: expected $EXPECTED, got '$served'" >&2
          exit 1
      - name: Promote to 100%
        run: |
          pnpm exec wrangler versions deploy -y \
            --message "Release ${{ inputs.ref }}" \
            "${{ steps.upload.outputs.version_id }}@100%"
      - name: Roll back on failure
        if: failure() && steps.current.outputs.version_id != ''
        run: |
          pnpm exec wrangler versions deploy -y \
            --message "Automatic rollback of ${{ inputs.ref }}" \
            "${{ steps.current.outputs.version_id }}@100%"
