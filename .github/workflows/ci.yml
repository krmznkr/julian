name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint, format, dead-code and the functional rules previously ran only in
      # the pre-commit hook, one --no-verify away from never running at all.
      - run: pnpm quality:static
      - run: pnpm test:run
      - run: pnpm test:tz:dates
      - run: pnpm build
