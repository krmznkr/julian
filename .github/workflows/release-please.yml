name: Release

# release-please keeps a release PR open with the next version and changelog.
# Merging it tags vX.Y.Z, publishes the GitHub Release and ships production.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release published with GITHUB_TOKEN does not trigger `release` workflows,
  # so production is deployed from here instead.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy-stable.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
