<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Julian shows your whole Google Calendar year on one screen. Try the live demo on sample data, no sign-in needed."
    />
    <!-- Portfolio showcase shared by direct link only: keep it out of search
         engines and AI crawlers. Belt-and-suspenders alongside /robots.txt. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- @share -->
    <title>Julian</title>
    <!-- Blocking script: apply theme, locale, and appearance preferences before
         first paint to prevent FOUC / layout shift. Runs synchronously before
         the module script that boots React. -->
    <script src="/bootstrap.js"></script>
    <noscript><style>[data-boot-loading]{display:none}</style></noscript>
  </head>
  <body class="min-h-screen antialiased">
    <!-- Painted before any script runs, so the first paint does not wait for
         the app's JavaScript. Same markup as RouteLoading
         (src/features/shell/route-loading.tsx); React replaces it on mount. -->
    <div id="root"><main class="flex min-h-dvh items-center justify-center bg-background px-6 text-sm text-muted-foreground"><span data-boot-loading>Loading calendar...</span><noscript>Julian needs JavaScript to show your calendar.</noscript></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
